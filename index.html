
<!DOCTYPE html>
<html lang="en-GB">
<head>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#111}
button,input,select{font-family:inherit}
button{cursor:pointer}
#pin{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:10}
.panel{background:#1e293b;color:white;padding:25px;border-radius:12px;text-align:center;width:min(92%,340px)}
.panel h2{color:#38bdf8;font-size:19px}
.panel p{color:#cbd5e1;font-size:12px}
#pininput{font-size:25px;letter-spacing:9px;text-align:center;width:165px;padding:9px;background:#0f172a;color:white;border:1px solid #64748b;border-radius:6px}
#pinerror{min-height:18px;color:#fca5a5;font-size:12px;margin-top:10px}
#hub{max-width:500px;margin:40px auto;padding:18px;color:#fff;display:none;text-align:center}
#hub h1{font-size:22px}
#hub small{color:#38bdf8}
#hub button.main{display:block;width:100%;margin-top:25px;background:#1e293b;color:#34d399;padding:20px;border:1px solid #475569;border-radius:8px;font-weight:bold}
#hub .smallbtn{background:transparent;border:0;color:#cbd5e1;margin:16px 8px;text-decoration:underline}
#app{display:none;background:#e5e7eb;min-height:100vh;padding:8px}
.dashboard{max-width:900px;margin:0 auto 10px;background:#111827;color:white;border-radius:8px;padding:10px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{color:white;background:#374151;border:0;border-radius:4px;padding:8px 10px;font-weight:700;font-size:11px}
.btn.green{background:#059669}
.btn.blue{background:#2563eb}
.btn.purple{background:#6d28d9}
.counters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}
.counter{background:#1f2937;text-align:center;border:1px solid #374151;border-radius:5px;padding:7px 3px;min-width:0}
.counter small{display:block;color:#cbd5e1;font-size:9px}
.counter strong{display:block;font-size:17px;margin:3px 0}
.counter span{font-size:10px;color:#fbbf24}
.counter input{width:48px}
.counter select{width:55px}
.counter input,.counter select{background:#0f172a;color:white;border:1px solid #64748b;font-size:10px}
#sites{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #475569}
#sites input{padding:6px;max-width:45%;border-radius:4px}
#tags{max-height:110px;overflow:auto;display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:10px;background:#374151;padding:5px;border-radius:12px}
.tag button{border:0;background:none;color:#fca5a5}
#suggest{display:none;position:absolute;background:#1e293b;color:white;z-index:20;max-height:160px;overflow:auto;border:1px solid #64748b}
#suggest div{padding:8px;cursor:pointer;font-size:12px;border-bottom:1px solid #475569}

/* Full A4 pages scaled to fit the phone */
#pages{width:100%;overflow:hidden}
.slot{position:relative;width:210mm;height:297mm;margin:0 auto 15px}
.paper{position:absolute;top:0;left:0;width:210mm;height:297mm;padding:9mm;background:white;transform-origin:top left;box-shadow:0 2px 7px #0002;overflow:hidden}
.paper table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #111}
.paper td,.paper th{border:1px solid #333;font-size:9px;padding:1px 2px;overflow:hidden;white-space:nowrap;text-overflow:clip;height:17px}
.paper th{font-weight:bold;text-align:center}
.paper .title{font-size:12px;font-weight:bold;text-align:center;height:23px}
.paper .headbox{text-align:center;vertical-align:top}
.paper .headbox input{display:block;text-align:center;font-weight:bold;font-size:12px;height:30px}
.paper input.cell{width:100%;height:100%;min-height:16px;margin:0;padding:0 2px;border:0;background:transparent;color:black;font-size:10px;text-align:center;outline:none}
.paper input.cell.left{text-align:left}
.paper input.cell:focus{background:#e0f2fe;outline:1px solid #0284c7}
.paper input.tick{cursor:pointer;font-size:14px;font-weight:bold}
.paper input.mismatch{color:#c00}
.paper tr.job td{height:27px}
.paper .b{font-weight:bold}
.paper .shade{background:#e5e7eb}
.check{accent-color:#000;width:12px;height:12px}

@media(max-width:650px){
#app{padding:5px}
.counters{grid-template-columns:repeat(2,1fr)}
.counter:last-child{grid-column:span 2}
}

@page{size:A4 portrait;margin:0}
@media print{
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{width:210mm!important;margin:0!important;background:white!important;overflow:visible!important}
#pin,#hub,.dashboard,#suggest{display:none!important}
#app{display:block!important;padding:0!important;min-height:0!important;background:white!important}
#pages{width:210mm!important;overflow:visible!important}
.slot{width:210mm!important;height:296mm!important;margin:0!important;break-inside:avoid!important;page-break-inside:avoid!important}
.paper{position:static!important;transform:none!important;width:210mm!important;height:296mm!important;box-shadow:none!important;padding:9mm!important}
#second{break-before:page!important;page-break-before:always!important}
#second.empty{display:none!important}
.paper input::placeholder{color:transparent!important;-webkit-text-fill-color:transparent!important}
.paper input.cell:focus{background:transparent;outline:0}
}
</style>

/* Scale full A4 pages to screen width */
function fit(){
let width=$('pages').clientWidth;
if(!width)return;
let w=210*96/25.4;
let h=297*96/25.4;
let scale=Math.min(1,(width-2)/w);
document.querySelectorAll('.slot').forEach(x=>{
x.style.width=(w*scale)+'px';
x.style.height=(h*scale)+'px';
x.firstElementChild.style.transform=`scale(${scale})`;
});
}

/* Dates and times */
function asDate(raw,y){
let m=raw.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
if(!m)return null;
let year=m[3]?+m[3]:y;
if(year<100)year+=2000;
let d=new Date(year,+m[2]-1,+m[1],12);
return d.getFullYear()===year&&
d.getMonth()===+m[2]-1&&
d.getDate()===+m[1]?d:null;
}

function fillDates(){
const d=asDate(get('f_wc'),new Date().getFullYear());
if(!d)return;
for(let i=0;i<7;i++){
let x=new Date(d);
x.setDate(d.getDate()+i);
$(`m_date_${i}`).value=
String(x.getDate()).padStart(2,'0')+'/'+
String(x.getMonth()+1).padStart(2,'0');
}
}

function rowDate(r){
let s='';
for(let i=r;i>=0;i--){
if(get(`r${i}_c0`)){
s=get(`r${i}_c0`);
break;
}
}
let wc=asDate(get('f_wc'),new Date().getFullYear());
return asDate(s,wc?.getFullYear()||new Date().getFullYear());
}

function time(s){
let m=s.match(/^(\d{1,2}):(\d{2})$/);
return m&&+m[1]<24&&+m[2]<60?
+m[1]*60 + +m[2]:null;
}

function formatDate(el){
let s=el.value.replace(/\D/g,'').slice(0,8);
el.value=s.length>4?
s.slice(0,2)+'/'+s.slice(2,4)+'/'+s.slice(4):
s.length>2?s.slice(0,2)+'/'+s.slice(2):s;
}

function formatTime(el){
let s=el.value.replace(/\D/g,'').slice(0,4);
el.value=s.length===4?
s.slice(0,2)+':'+s.slice(2):
s.length===3?s.slice(0,1)+':'+s.slice(1):s;
}

/* Mileage calculations */
function recomputeMileage(){
if(get('m_start_0')===''&&localStorage.getItem(CKEY)!==null){
set('m_start_0',Number(localStorage.getItem(CKEY)));
}

for(let i=0;i<7;i++){
let old=number(`m_start_${i}`);
let prev=number(`m_fin_${i-1}`);

if(i>0){
if(!manualStart[i]||!good(old)||
good(autoStart[i])&&old===autoStart[i]){
set(`m_start_${i}`,prev);
autoStart[i]=good(prev)?prev:null;
manualStart[i]=false;
}
else if(good(prev)&&old>prev){
let gap=round(old-prev);
let oldP=number(`m_priv_${i-1}`);
set(`m_priv_${i-1}`,(good(oldP)?oldP:0)+gap);

let pstart=number(`m_start_${i-1}`);
let work=number(`m_work_${i-1}`);
let priv=number(`m_priv_${i-1}`);

if(good(pstart)){
set(`m_fin_${i-1}`,pstart+
(good(work)?work:0)+(good(priv)?priv:0));
}
manualStart[i]=false;
autoStart[i]=old;
}

$(`m_start_${i}`).classList.toggle(
'mismatch',
good(prev)&&good(number(`m_start_${i}`))&&
number(`m_start_${i}`)<prev
);
}

let start=number(`m_start_${i}`);
let work=number(`m_work_${i}`);
let priv=number(`m_priv_${i}`);

if(good(start)&&(good(work)||good(priv))){
set(`m_fin_${i}`,start+
(good(work)?work:0)+(good(priv)?priv:0));
}
}

let w=0,p=0,last=NaN,hw=false,hp=false;
for(let i=0;i<7;i++){
let a=number(`m_work_${i}`);
let b=number(`m_priv_${i}`);
let f=number(`m_fin_${i}`);
if(good(a)){w+=a;hw=true}
if(good(b)){p+=b;hp=true}
if(good(f))last=f;
}

set('m_tot_work',hw?w:NaN);
set('m_tot_priv',hp?p:NaN);
set('m_tot_priv_footer',hp?p:NaN);
set('m_tot_fin',last);
}

/* Overtime */
function rowOT(r){
if(manualOT[r])return;

let a=time(get(`r${r}_c8`));
let b=time(get(`r${r}_c9`));

if(a===null||b===null){
$(`r${r}_c10`).value='';
return;
}

if(b<a)b+=1440;

let d=rowDate(r);
let weekend=d&&(d.getDay()===0||d.getDay()===6);
let ot=0;

if(weekend){
ot=b-a;
if(ot>360)ot-=30;
}else{
ot=Math.max(0,Math.min(480,b)-a-30)+
Math.max(0,b-Math.max(1050,a)-30);
}

ot=Math.round(Math.max(0,ot)/15)*15;
set(`r${r}_c10`,ot?ot/60:NaN);
}

/* Totals and dashboard */
function totals(){
let groups=new Map();
let current='undated';
let sites=0;

for(let r=0;r<totalRows;r++){
if(get(`r${r}_c1`))sites++;
if(get(`r${r}_c0`)){
let d=rowDate(r);
current=d?d.toDateString():'invalid-'+r;
}
let a=time(get(`r${r}_c8`));
let b=time(get(`r${r}_c9`));
if(a!==null&&b!==null){
groups.set(current,
(groups.get(current)||0)+
((b<a?b+1440:b)-a));
}
}

let mins=0,breakMins=0;
for(let duration of groups.values()){
let br=duration>360?30:0;
mins+=duration-br;
breakMins+=br;
}

let tasks=0,ot=0;

for(let c of [3,4,5,6,7,10]){
let left=0,right=0,hasL=false,hasR=false;
for(let r=0;r<totalRows;r++){
let x=get(`r${r}_c${c}`);
if(!x)continue;
let n=c===10?Number(x)||0:1;
if(r<firstRows){left+=n;hasL=true}
else{right+=n;hasR=true}
}
let key=c===10?'ot':fields[c-3];

set(`tot_${key}_p1`,hasL?left:NaN);
set(`tot_${key}_p2`,hasR?right:NaN);
set(`tot_${key}_p1_copy`,hasL?left:NaN);
set(`tot_${key}`,hasL||hasR?left+right:NaN);

if(c===10)ot=left+right;
else tasks+=left+right;
}

let w=0,p=0,days=0;
for(let i=0;i<7;i++){
let a=number(`m_work_${i}`);
let b=number(`m_priv_${i}`);
if(good(a)&&a>0){w+=a;days++}
if(good(b)&&b>0)p+=b;
}

$('cw').textContent=round(w);
$('cp').textContent=round(p);
$('co').textContent=Math.round(ot*100)/100;
$('ct').textContent=tasks;
$('ch').textContent=Math.floor(mins/60)+'h '+
String(mins%60).padStart(2,'0')+'m';

$('ew').textContent='5-day est: '+
(days?Math.round(w/days*5):0)+' mi';

$('days').textContent=days+' days logged';
$('siteslogged').textContent=sites+' sites logged';

$('breaks').textContent=groups.size+
' days · −'+breakMins+'m break';

$('earnings').textContent='£'+
(ot*(Number(get('ot_rate'))||0)*
(Number(get('ot_mult'))||1)).toFixed(2)+' est';

let used=false;
for(let r=firstRows;r<totalRows;r++){
for(let c=0;c<11;c++){
if(get(`r${r}_c${c}`))used=true;
}
}
$('second').classList.toggle('empty',!used);
}

/* Saved sites */
function customSites(){
try{
let x=JSON.parse(localStorage.getItem(ZKEY)||'[]');
return Array.isArray(x)?x:[];
}catch{return []}
}

function allSites(){
let map=new Map(DEFAULT_SITES.map(x=>[
x.toLowerCase(),{name:x,zone:''}
]));
for(let s of customSites()){
if(s&&s.name){
map.set(s.name.toLowerCase(),
{name:s.name,zone:s.zone||''});
}
}
return [...map.values()]
.sort((a,b)=>a.name.localeCompare(b.name));
}

function renderSites(){
let box=$('tags');
box.replaceChildren();
for(let s of customSites()){
let chip=document.createElement('span');
chip.className='tag';
chip.textContent=s.name+
(s.zone?' (Zone '+s.zone+')':'');

let b=document.createElement('button');
b.textContent='×';
b.onclick=()=>{
localStorage.setItem(ZKEY,
JSON.stringify(customSites()
.filter(x=>x.name!==s.name)));
renderSites();
save();
};
chip.append(b);
box.append(chip);
}
}

function suggest(input,r){
let q=input.value.trim().toLowerCase();
let box=$('suggest');
if(!q){box.style.display='none';return}

let matches=allSites().filter(s=>
s.name.toLowerCase().includes(q)).slice(0,10);

if(!matches.length){box.style.display='none';return}

let rect=input.getBoundingClientRect();
box.style.left=(rect.left+scrollX)+'px';
box.style.top=(rect.bottom+scrollY)+'px';
box.style.width=Math.max(220,rect.width)+'px';
box.replaceChildren();

for(let s of matches){
let d=document.createElement('div');
d.textContent=s.name+(s.zone?' — Z'+s.zone:'');
d.onpointerdown=e=>{
e.preventDefault();
input.value=s.name;
if(!get(`r${r}_c2`)){
$(`r${r}_c2`).value=s.zone;
}
box.style.display='none';
totals();
save();
};
box.append(d);
}
box.style.display='block';
}

/* Save and sync */
function snapshot(){
let inputs={},checks={};

document.querySelectorAll(
'input.cell:not([readonly]),input.tick,#ot_rate,#ot_mult'
).forEach(e=>{
if(e.id&&e.value!=='')inputs[e.id]=e.value;
});

document.querySelectorAll('.check').forEach(e=>
checks[e.id]=e.checked);

return {
inputs,checks,
meta:{
manualStarts:[...manualStart],
autoStarts:[...autoStart],
manualOvertime:[...manualOT]
}
};
}

function encode(o){
let str=new TextEncoder().encode(JSON.stringify(o));
let bin='';
str.forEach(x=>bin+=String.fromCharCode(x));
return btoa(bin).replace(/\+/g,'-')
.replace(/\//g,'_').replace(/=+$/,'');
}

function decode(s){
try{
let x=s.replace(/^#/,'').replace(/-/g,'+')
.replace(/_/g,'/');
while(x.length%4)x+='=';
return JSON.parse(new TextDecoder().decode(
Uint8Array.from(atob(x),c=>c.charCodeAt(0))
));
}catch{return null}
}

function packageState(){
return {
s:snapshot(),
c:customSites(),
o:localStorage.getItem(CKEY)||''
};
}

function save(){
if(loading)return;
try{
localStorage.setItem(SKEY,JSON.stringify(snapshot()));
clearTimeout(hashTimer);
hashTimer=setTimeout(()=>{
try{
history.replaceState(null,'',
'#'+encode(packageState()));
}catch(e){}
},250);
}catch(e){console.error(e)}
}

function load(skipHash=false){
loading=true;
try{
if(!skipHash&&location.hash.length>2){
let x=decode(location.hash);
if(x?.s?.inputs){
localStorage.setItem(SKEY,JSON.stringify(x.s));
if(Array.isArray(x.c)){
localStorage.setItem(ZKEY,JSON.stringify(x.c));
}
if(typeof x.o==='string'){
localStorage.setItem(CKEY,x.o);
}
}
}

let s=JSON.parse(localStorage.getItem(SKEY)||'null');

if(s?.inputs){
document.querySelectorAll(
'input.cell:not([readonly]),input.tick,#ot_rate,#ot_mult'
).forEach(e=>{
e.value=e.id==='f_name'?'Martin Law':
e.id==='ot_rate'?'15.66':
e.id==='ot_mult'?'1.5':'';
});

document.querySelectorAll('.check')
.forEach(e=>e.checked=false);

for(let [id,v] of Object.entries(s.inputs)){
let e=$(id);
if(e&&(e.classList.contains('tick')||
!e.readOnly)&&['string','number'].includes(typeof v)){
e.value=String(v);
}
}

for(let [id,v] of Object.entries(s.checks||{})){
if($(id))$(id).checked=!!v;
}

manualStart=Array.from({length:7},(_,i)=>
!!s.meta?.manualStarts?.[i]);

autoStart=Array.from({length:7},(_,i)=>
typeof s.meta?.autoStarts?.[i]==='number'?
s.meta.autoStarts[i]:null);

manualOT=Array.from({length:43},(_,i)=>
!!s.meta?.manualOvertime?.[i]);

if(!s.meta){
for(let i=1;i<7;i++){
let a=number(`m_start_${i}`);
let b=number(`m_fin_${i-1}`);
manualStart[i]=good(a)&&(!good(b)||a!==b);
autoStart[i]=a===b?b:null;
}
}
}

recomputeMileage();
totals();
}catch(e){console.error(e)}
finally{loading=false}
}

/* JSON backup */
function backup(){
save();
let data={
timestamp:Date.now(),
storage:localStorage.getItem(SKEY),
sites:localStorage.getItem(ZKEY),
pin:localStorage.getItem(PKEY),
carry:localStorage.getItem(CKEY)
};

let u=URL.createObjectURL(
new Blob([JSON.stringify(data,null,2)],
{type:'application/json'})
);

let a=document.createElement('a');
a.href=u;
a.download='work_hub_backup_'+
new Date().toISOString().slice(0,10)+'.json';
document.body.append(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(u),1000);
}

function importBackup(f){
if(!f)return;
let rd=new FileReader();
rd.onload=()=>{
try{
let x=JSON.parse(rd.result);
if(!JSON.parse(x.storage)?.inputs){
throw Error('Invalid');
}
localStorage.setItem(SKEY,x.storage);
if(typeof x.sites==='string'){
localStorage.setItem(ZKEY,x.sites);
}
if(typeof x.carry==='string'){
localStorage.setItem(CKEY,x.carry);
}
if(/^\d{4}$/.test(x.pin||'')){
localStorage.setItem(PKEY,x.pin);
}
load(true);
renderSites();
save();
alert('Backup imported');
}catch{
alert('Invalid backup file');
}finally{$('file').value=''}
};
rd.readAsText(f);
}

/* New week */
function newWeek(){
if(!confirm(
'Start a new week? Your name, vehicle, leader and saved sites stay.'
))return;

let last=NaN;
for(let i=6;i>=0;i--){
if(good(number(`m_fin_${i}`))){
last=number(`m_fin_${i}`);
break;
}
}

if(good(last)){
localStorage.setItem(CKEY,String(last));
}

document.querySelectorAll('.weekly').forEach(e=>
e.type==='checkbox'?e.checked=false:e.value='');

manualStart.fill(false);
autoStart.fill(null);
manualOT.fill(false);
recomputeMileage();
totals();
save();
}

/* Input handling */
function onInput(e){
let el=e.target,id=el.id;
if(!id||
['pininput','site_name','site_zone'].includes(id))return;

if(el.classList.contains('date')){
formatDate(el);
if(id==='f_wc')fillDates();
}
if(el.classList.contains('time')){
formatTime(el);
}

let m=id.match(/^m_(start|fin|work|priv)_(\d)$/);
if(m){
let d=+m[2],kind=m[1];

if(kind==='start'&&d>0){
manualStart[d]=!!get(id);
autoStart[d]=null;
}

if(kind==='fin'){
let start=number(`m_start_${d}`);
let finish=number(`m_fin_${d}`);
let work=number(`m_work_${d}`);
let priv=number(`m_priv_${d}`);

if(good(start)&&good(finish)&&finish>=start){
if(good(work)&&finish-start>=work){
set(`m_priv_${d}`,finish-start-work);
}else if(good(priv)&&finish-start>=priv){
set(`m_work_${d}`,finish-start-priv);
}
}
}
recomputeMileage();
}

let r=id.match(/^r(\d+)_c(\d+)$/);
if(r){
let i=+r[1],c=+r[2];

if(c===1){
let match=allSites().find(s=>
s.name.toLowerCase()===get(id).toLowerCase());
if(match&&match.zone&&!get(`r${i}_c2`)){
$(`r${i}_c2`).value=match.zone;
}
suggest(el,i);
}

if(c===8||c===9)rowOT(i);
if(c===10)manualOT[i]=!!get(id);
}

totals();
save();
}

/* Initialise */
function init(){
build();
load();
renderSites();

$('unlock').onclick=verify;
$('pininput').oninput=()=>{
if(get('pininput').length===4)verify();
};

$('opentool').onclick=()=>view('app');
$('back').onclick=()=>view('hub');

$('lock').onclick=()=>{
localStorage.removeItem(AKEY);
view('pin');
};

$('changepin').onclick=()=>{
let old=prompt('Current PIN:');
if(old===null)return;
if(old!==(localStorage.getItem(PKEY)||'1234')){
return alert('Incorrect PIN');
}
let pin=prompt('New four-digit PIN:');
if(/^\d{4}$/.test(pin||'')){
localStorage.setItem(PKEY,pin);
alert('PIN changed');
}else if(pin!==null){
alert('Enter four digits');
}
};

$('pdf').onclick=()=>window.print();

$('go2').onclick=()=>
$('second').scrollIntoView({behavior:'smooth'});

$('newweek').onclick=newWeek;

$('managesites').onclick=()=>{
$('sites').style.display=
$('sites').style.display==='block'?'none':'block';
};

$('addsite').onclick=()=>{
let n=get('site_name');
let z=get('site_zone');
if(!n)return;

let arr=customSites().filter(x=>
x.name.toLowerCase()!==n.toLowerCase());

arr.push({name:n,zone:z});
localStorage.setItem(ZKEY,JSON.stringify(arr));
$('site_name').value='';
$('site_zone').value='';
renderSites();
save();
};

$('export').onclick=backup;
$('import').onclick=()=>$('file').click();
$('file').onchange=e=>importBackup(e.target.files[0]);

$('link').onclick=async()=>{
save();
clearTimeout(hashTimer);
history.replaceState(null,'',
'#'+encode(packageState()));
try{
await navigator.clipboard.writeText(location.href);
$('link').textContent='Link Copied!';
setTimeout(()=>
$('link').textContent='Copy Sync Link',1700);
}catch{
prompt('Copy your sync link:',location.href);
}
};

document.addEventListener('input',onInput);

document.addEventListener('change',e=>{
if(e.target.classList.contains('check')||
e.target.id==='ot_mult'){
totals();
save();
}
});

document.addEventListener('click',e=>{
if(!e.target.closest('#suggest')&&
!e.target.classList.contains('site')){
$('suggest').style.display='none';
}
});

document.querySelectorAll('.tick').forEach(e=>{
e.onclick=()=>{
e.value=e.value==='✓'?'':'✓';
totals();
save();
};
});

window.addEventListener('resize',fit);
window.addEventListener('hashchange',()=>{
load();
renderSites();
});
window.addEventListener('afterprint',fit);

view(localStorage.getItem(AKEY)==='1'?'hub':'pin');
}

document.addEventListener('DOMContentLoaded',init);
</script>
