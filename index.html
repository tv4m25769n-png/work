
<!-- MOBILE A4 DISPLAY FIX -->
<style>
@media screen {
  #timesheet_view .sheet-scroll {
    width: 100% !important;
    max-width: 100% !important;
    overflow: visible !important;
  }

  #timesheet_view .sheet-page {
    zoom: var(--a4-scale, 1);
    width: 210mm !important;
    height: 297mm !important;
    min-height: 297mm !important;
    max-width: none !important;
    padding: 10mm !important;
    margin: 0 auto 14px !important;
    overflow: hidden !important;
  }
}

@media print {
  #timesheet_view .sheet-page {
    zoom: 1 !important;
    width: 210mm !important;
    height: 296mm !important;
  }
}
</style>

<script>
(function () {
  function fitA4ToScreen() {
    const wrapper = document.querySelector(
      '#timesheet_view .sheet-scroll'
    );

    const pages = document.querySelectorAll(
      '#timesheet_view .sheet-page'
    );

    if (!wrapper || !pages.length) return;

    pages.forEach(page => {
      page.style.setProperty('--a4-scale', '1');
    });

    const fullWidth =
      pages[0].getBoundingClientRect().width;

    const availableWidth = wrapper.clientWidth - 4;

    const scale = Math.min(
      1,
      availableWidth / fullWidth
    );

    pages.forEach(page => {
      page.style.setProperty(
        '--a4-scale',
        String(scale)
      );
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      fitA4ToScreen
    );
  } else {
    fitA4ToScreen();
  }

  window.addEventListener('resize', fitA4ToScreen);
  window.addEventListener('orientationchange', fitA4ToScreen);
  window.addEventListener('afterprint', fitA4ToScreen);
})();
</script>
