
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Martin Law — Work Hub</title>
<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f172a;color:#000}
button,input,select{font-family:inherit}
button{cursor:pointer}
#pin{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:100}
.panel{background:#1e293b;color:white;padding:25px;border-radius:12px;text-align:center;width:min(92%,340px);border:1px solid #334155}
.panel h2{color:#38bdf8;font-size:19px;margin:0 0 6px}
.panel p{color:#cbd5e1;font-size:12px;margin:0 0 16px}
#pininput{font-size:25px;letter-spacing:9px;text-align:center;width:165px;padding:9px;background:#0f172a;color:white;border:1px solid #64748b;border-radius:6px;display:block;margin:0 auto 12px}
#pinerror{min-height:18px;color:#fca5a5;font-size:12px;margin-top:10px}
#hub{max-width:500px;margin:40px auto;padding:18px;color:#fff;display:none;text-align:center}
#hub h1{font-size:22px;margin:0 0 4px}
#hub small{color:#38bdf8}
#hub button.main{display:block;width:100%;margin-top:25px;background:#1e293b;color:#34d399;padding:20px;border:1px solid #475569;border-radius:8px;font-weight:bold;font-size:16px}
#hub .smallbtn{background:transparent;border:0;color:#cbd5e1;margin:16px 8px;text-decoration:underline;font-size:12px}
#app{display:none;background:#e5e7eb;min-height:100vh;padding:8px}
.dashboard{max-width:900px;margin:0 auto 10px;background:#111827;color:white;border-radius:8px;padding:10px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{color:white;background:#374151;border:0;border-radius:4px;padding:8px 10px;font-weight:700;font-size:11px}
.btn.green{background:#059669}
.btn.blue{background:#2563eb}
.btn.purple{background:#6d28d9}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.counter{background:#1f2937;text-align:center;border:1px solid #374151;border-radius:5px;padding:7px 4px;min-width:0}
.counter small{display:block;color:#cbd5e1;font-size:9px}
.counter strong{display:block;font-size:17px;margin:3px 0}
.counter span{font-size:10px;color:#fbbf24}
.counter input{width:48px;text-align:center}
.counter select{width:55px}
.counter input,.counter select{background:#0f172a;color:white;border:1px solid #64748b;font-size:10px;border-radius:3px;padding:1px}
#sites{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #475569}
#sites input{padding:6px;max-width:42%;border-radius:4px;border:1px solid #475569;background:#1f2937;color:#fff}
#tags{max-height:110px;overflow:auto;display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:10px;background:#374151;padding:4px 8px;border-radius:12px}
.tag button{border:0;background:none;color:#fca5a5;margin-left:4px;font-weight:bold}
#suggest{display:none;position:absolute;background:#1e293b;color:white;z-index:50;max-height:160px;overflow:auto;border:1px solid #64748b;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,0.35)}
#suggest div{padding:8px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid #475569}
#suggest div:hover{background:#2563eb}

/* Exact A4 sheets scaled to screen */
#pages{width:100%;overflow:hidden}
.slot{position:relative;width:210mm;height:297mm;margin:0 auto 18px}
.paper{position:absolute;top:0;left:0;width:210mm;height:297mm;padding:11mm 12mm;background:white;transform-origin:top left;box-shadow:0 3px 10px rgba(0,0,0,0.22);overflow:hidden}
.paper table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;border:1.2px solid #000}
.paper td,.paper th{border:1px solid #000;font-size:9px;padding:0 3px;overflow:hidden;white-space:nowrap;text-overflow:clip;vertical-align:middle;height:18px}
.paper th{font-weight:bold;text-align:center}
.paper .title{font-size:11.5px;font-weight:bold;text-align:center;height:20px;letter-spacing:0.2px}
.paper .headbox{text-align:center;vertical-align:top;padding-top:2px;font-size:9px;font-weight:normal}
.paper .headbox input{display:block;text-align:center;font-weight:bold;font-size:11px;height:34px;margin-top:2px}
.paper input.cell{width:100%;height:100%;margin:0;padding:0 2px;border:0;background:transparent;color:#000;font-size:9.5px;text-align:center;outline:none}
.paper input.cell.left{text-align:left}
.paper input.cell:focus{background:#e0f2fe}
.paper input.tick{cursor:pointer;font-size:12px;font-weight:bold}
.paper input.mismatch{color:#dc2626;font-weight:bold}
.paper .b{font-weight:bold}
.paper .r{font-weight:normal;text-align:center}
.paper .shade{background:#b8b9bc!important}
.day-chk{display:none}
.day-lbl{display:inline-block;font-weight:bold;cursor:pointer;padding:0 4px;border-radius:50%;border:1.5px solid transparent}
.day-chk:checked + .day-lbl{border-color:#000}

@media(max-width:650px){
#app{padding:5px}
.counters{grid-template-columns:repeat(2,1fr)}
}

@page{size:A4 portrait;margin:0}
@media print{
html,body{width:210mm!important;margin:0!important;padding:0!important;background:white!important;overflow:visible!important}
#pin,#hub,.dashboard,#suggest{display:none!important}
#app{display:block!important;padding:0!important;min-height:0!important;background:white!important}
#pages{width:210mm!important;overflow:visible!important}
.slot{width:210mm!important;height:296.5mm!important;margin:0!important;break-inside:avoid!important;page-break-inside:avoid!important}
.paper{position:static!important;transform:none!important;width:210mm!important;height:296.5mm!important;box-shadow:none!important;padding:11mm 12mm!important}
#second{break-before:page!important;page-break-before:always!important}
#second.empty{display:none!important}
.paper input::placeholder{color:transparent!important;-webkit-text-fill-color:transparent!important}
.paper input.cell:focus{background:transparent!important}
}
</style>
</head>
<body>

<div id="pin">
<div class="panel">
<h2>work.martinlaw.me</h2>
<p>Enter your 4-digit PIN</p>
<input id="pininput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
<button type="button" class="btn green" id="unlock" style="width:100%;padding:10px;font-size:13px">Unlock</button>
<div id="pinerror"></div>
</div>
</div>

<div id="hub">
<h1>Martin Law — Work Hub</h1>
<small>work.martinlaw.me</small>
<button type="button" class="main" id="opentool">Weekly Mileage &amp; Timesheet</button>
<button type="button" class="smallbtn" id="changepin">Change PIN</button>
<button type="button" class="smallbtn" id="lock">Lock Hub</button>
</div>

<div id="app">
<div class="dashboard">
<div class="controls" style="justify-content:space-between">
<div class="controls">
<button type="button" class="btn" id="back">← Back to Hub</button>
<strong style="color:#34d399;font-size:13px">Live Weekly Counter</strong>
</div>
<div class="controls">
<button type="button" class="btn blue" id="export">Export Save</button>
<button type="button" class="btn blue" id="import">Import Save</button>
<button type="button" class="btn purple" id="managesites">Manage Sites</button>
<button type="button" class="btn" id="newweek">New Week</button>
<button type="button" class="btn green" id="pdf">Download / Save as PDF</button>
</div>
</div>

<div class="counters">
<div class="counter">
<small>WORK MILES</small>
<strong id="cw">0</strong>
<span id="ew">5-day est: 0</span>
</div>
<div class="counter">
<small>PRIVATE MILES</small>
<strong id="cp">0</strong>
<span id="days">0 days logged</span>
</div>
<div class="counter">
<small>OVERTIME HRS</small>
<strong id="co">0</strong>
<div>
<span>£</span>
<input id="ot_rate" value="15.66" inputmode="decimal">
<select id="ot_mult">
<option value="1">1x</option>
<option value="1.25">1.25x</option>
<option selected value="1.5">1.5x</option>
<option value="2">2x</option>
</select>
</div>
<span id="earnings">£0.00</span>
</div>
<div class="counter">
<small>TOTAL HOURS</small>
<strong id="ch">0h 00m</strong>
<span id="breaks">0 days · −0m break</span>
</div>
</div>

<div id="sites">
<div class="controls">
<input id="site_name" placeholder="Site name">
<input id="site_zone" placeholder="Zone" inputmode="numeric">
<button type="button" id="addsite" class="btn green">+ Add Site</button>
</div>
<div id="tags"></div>
</div>
</div>
<input type="file" id="file" accept=".json" hidden>
<div id="suggest"></div>
<div id="pages"></div>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const SKEY='nurture_ts_master_v3';
const CKEY='ml_carry_odo';
const ZKEY='nurture_saved_sites_v3';
const PKEY='ml_hub_pin';
const AKEY='ml_hub_unlocked';

function sGet(k,fb=''){try{return localStorage.getItem(k)??fb;}catch(e){return fb;}}
function sSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function sDel(k){try{localStorage.removeItem(k);}catch(e){}}

const DEFAULT_SITES=`Buckingham Palace|St James's Palace|Clarence House|Kensington Palace|Windsor Castle|Frogmore House|Hampton Court Palace|Tower of London|Horse Guards|MOD Main Building Whitehall|Old War Office Whitehall|Wellington Barracks|Hyde Park Barracks|Regent's Park Barracks|Chelsea Barracks|Royal Hospital Chelsea|Victoria Barracks Windsor|Combermere Barracks Windsor|Royal Artillery Barracks Woolwich|Woolwich Garrison|Napier Lines Woolwich|Cavalry Barracks Hounslow|Armoury House (HAC)|King's Troop RHA Woolwich|Latchmere House|Kneller Hall Twickenham|Northwood Headquarters|RMAS Sandhurst|Watchfield / Defence Academy Shrivenham|Denison Barracks Hermitage|Brock Barracks Reading|AWE Aldermaston|AWE Burghfield|Arborfield Garrison|Bramley Training Area|RAF Welford|Aldershot Garrison|Lille Barracks Aldershot|Mons Barracks Aldershot|Buller Barracks Aldershot|Travers Barracks Aldershot|Browning Barracks Aldershot|Gale Barracks Aldershot|Duchess of Kent Barracks Aldershot|Montgomery Lines Aldershot|St Omer Barracks Aldershot|Normandy Barracks Aldershot|Thornhill Barracks Aldershot|Wavell Barracks Aldershot|Minley Station|Gibraltar Barracks Minley|Minley Manor|Deepcut Barracks (Princess Royal Barracks)|Keogh Barracks Ash Vale|Pirbright Camp (ATC Pirbright)|Alexander Barracks Pirbright|Elizabeth Barracks Pirbright|Brunswick Camp Pirbright|Headley Court|RAF Odiham|RAF Oakhanger|Bordon & Longmoor Garrison|Longmoor Camp|Barton Stacey Camp|MOD Worthy Down|Sir John Moore Barracks Winchester|Southwick Park (HMS Dryad)|Middle Wallop (AACen)|Andover (Marlborough Lines / Army HQ)|Marchwood Military Port|HMNB Portsmouth|HMS Nelson Portsmouth|HMS Excellent Whale Island|HMS Collingwood Fareham|HMS Sultan Gosport|HMS Temeraire Portsmouth|Fort Blockhouse Gosport|DM Gosport|Horsea Island|Tipner Ranges|Browndown Camp|Thorney Island (Baker Barracks)|RAF Medmenham|Danesfield House Medmenham|RAF High Wycombe (Air Command)|RAF Halton|RAF Daws Hill|Wilton Park Beaconsfield|RAF Brize Norton|RAF Benson|Dalton Barracks Abingdon|Edward Brooks Barracks Abingdon|Bicester Garrison|St George's Barracks Bicester|St David's Barracks Bicester|MOD Bicester|RAF Weston-on-the-Green|Vauxhall Barracks Didcot|RAF Croughton|RAF Barford St John|Chicksands (DIFC)|RAF Henlow|Brompton Barracks Chatham|Chattenden Barracks|Lodge Hill Camp|Upnor Castle / Upper Upnor|Invicta Park Barracks Maidstone|Shorncliffe Garrison|Sir John Moore Barracks Shorncliffe|Risborough Barracks Shorncliffe|Burgoyne Barracks Shorncliffe|Somerset Barracks Shorncliffe|Napier Barracks Folkestone|St Martin's Plain Camp|Hythe Ranges|Lydd Ranges / Lydd Camp|Dover Duke of York's Royal Military School|Crowborough Training Camp|Newhaven Fort / Reserve Centre|Colchester Garrison|Merville Barracks Colchester|Goojera Barracks Colchester|Foynes Barracks Colchester|Carver Barracks Wimbish|MOD Shoeburyness (Foulness Island)|Fingringhoe Ranges|Tidworth Camp / Garrison|Aliwal Barracks Tidworth|Assaye Barracks Tidworth|Bhurtpore Barracks Tidworth|Candahar Barracks Tidworth|Delhi Barracks Tidworth|Jellalabad Barracks Tidworth|Lucknow Barracks Tidworth|Mooltan Barracks Tidworth|Swinton Barracks Perham Down|Bulford Camp / Garrison|Kiwi Barracks Bulford|Picton Barracks Bulford|Ward Barracks Bulford|Wing Barracks Bulford|Larkhill Garrison|Purvis Lines Larkhill|Horne Barracks Larkhill|Roberts Barracks Larkhill|Warminster Garrison|Battlesbury Barracks Warminster|Harman Lines Warminster|Waterloo Lines Warminster|Upavon Station (Trenchard Lines)|MOD Boscombe Down|Porton Down (Dstl)|MOD Lyneham|MOD Corsham|Azimghur Barracks Colerne|Buckley Barracks Hullavington|Bovington Camp|Allenby Barracks Bovington|Lulworth Camp|Stanley Barracks Bovington|Blandford Camp|RNAS Yeovilton|RM Poole (Hamworthy)|Wyvern Barracks Exeter|CTCRM Lympstone|RM Bickleigh|Royal Citadel Plymouth|HMNB Devonport|RNAS Culdrose|Imjin Barracks Innsworth|RAF Fairford|Duke of Gloucester Barracks South Cerney|Beachley Barracks Chepstow|RAF Northolt|RAF Wyton|RAF Alconbury|RAF Molesworth|Bassingbourn Barracks|Waterbeach Barracks|RAF Honington|RAF Barnham|RAF Lakenheath|RAF Mildenhall|RAF Feltwell|RAF Marham|Robertson Barracks Swanton Morley|Stanford Training Area (STANTA)|Gibraltar Barracks Bury St Edmunds|Wattisham Flying Station|Rock Barracks Woodbridge|RAF Wittering|Kendrew Barracks Cottesmore|St George's Barracks North Luffenham|Prince William of Gloucester Barracks Grantham|RAF Cranwell|RAF Barkston Heath|RAF Waddington|RAF Coningsby|RAF Digby|RAF Scampton|RAF Syerston|RAF Donna Nook|RAF Holbeach|Chetwynd Barracks Chilwell|Gamecock Barracks Bramcote|MOD Stafford (Beacon Barracks)|Whittington Barracks Lichfield (DMS)|MOD Donnington|RAF Cosford|RAF Shawbury|Clive Barracks Tern Hill|Copthorne Barracks Shrewsbury|Credenhill (Stirling Lines)|MOD Kineton|MOD St Athan|Brecon Barracks|Sennybridge Training Area|Castlemartin Camp|RAF Valley|Dale Barracks Chester|Weeton Barracks|Fulwood Barracks Preston|RAF Woodvale|Catterick Garrison|Marne Barracks Catterick|Bourlon Barracks Catterick|Gaza Barracks Catterick|Megiddo Lines Catterick|Somme Barracks Catterick|Vimy Barracks Catterick|Imphal Barracks York|Queen Elizabeth Barracks Strensall|Alanbrooke Barracks Topcliffe|Claro Barracks Ripon|Uniacke Barracks Harrogate|Normandy Barracks Leconfield|RAF Leeming|RAF Fylingdales|RAF Menwith Hill|RAF Staxton Wold|Albemarle Barracks Harlow Hill|RAF Boulmer|RAF Spadeadam`.split('|');

// Exact row counts from physical Nurture forms: 34 on Page 1, 41 on Page 2
const firstRows=34;
const totalRows=75;
const fields=['r','efk','fu','co','t'];

let manualOT=Array(totalRows).fill(false);
let loading=false;

const get=id=>$(id)?.value?.trim()||'';
const number=id=>get(id)===''?NaN:Number(get(id));
const good=Number.isFinite;
const round=n=>Math.round(n*10)/10;

function set(id,n){
  if($(id))$(id).value=good(n)?String(Math.round(n*100)/100):'';
}

function setMileCell(id,n,isManual){
  const el=$(id);
  if(!el)return;
  if(good(n)){
    el.value=String(round(n));
    el.dataset.manual=isManual?'1':'0';
  }else{
    el.value='';
    el.dataset.manual='0';
  }
}

function isMan(id){
  const el=$(id);
  return !!(el&&el.value.trim()!==''&&el.dataset.manual==='1');
}

function view(v){
  $('pin').style.display=v==='pin'?'flex':'none';
  $('hub').style.display=v==='hub'?'block':'none';
  $('app').style.display=v==='app'?'block':'none';
  if(v==='app')requestAnimationFrame(fit);
}

function verify(){
  if(get('pininput')===(sGet(PKEY,'1234')||'1234').trim()){
    sSet(AKEY,'1');
    $('pininput').value='';
    $('pinerror').textContent='';
    view('hub');
  }else{
    $('pinerror').textContent='Incorrect PIN';
    $('pininput').value='';
  }
}

function fit(){
  let width=$('pages').clientWidth;
  if(!width)return;
  let w=210*96/25.4;
  let h=297*96/25.4;
  let scale=Math.min(1,(width-4)/w);
  document.querySelectorAll('.slot').forEach(x=>{
    x.style.width=(w*scale)+'px';
    x.style.height=(h*scale)+'px';
    x.firstElementChild.style.transform=`scale(${scale})`;
  });
}

const colgroup='<colgroup>'+
[7.2,22.8,11.5,5.0,5.0,5.0,5.0,5.0,11.5,11.5,10.5]
.map(w=>`<col style="width:${w}%">`).join('')+
'</colgroup>';

function input(id,classes='weekly',extra=''){
  return `<input type="text" id="${id}" class="cell ${classes}" ${extra}>`;
}

function jobHeader(){
  return '<tr>'+
  ['Date','Site details','Zone number','R','EFK','F/U','C/O','T','Start Time','Finish Time','Overtime']
  .map((x,i)=>`<th style="${i<2?'text-align:left;padding-left:3px':''}">${x}</th>`).join('')+'</tr>';
}

function rows(a,b){
  let out='';
  for(let r=a;r<b;r++){
    out+=`<tr class="job">
    <td>${input(`r${r}_c0`,'weekly date','inputmode="numeric" placeholder="DD/MM"')}</td>
    <td>${input(`r${r}_c1`,'weekly site left','autocomplete="off"')}</td>
    <td>${input(`r${r}_c2`,'weekly','inputmode="numeric"')}</td>`;
    for(let c=3;c<8;c++){
      out+=`<td>${input(`r${r}_c${c}`,'weekly tick','readonly')}</td>`;
    }
    out+=`<td>${input(`r${r}_c8`,'weekly time','inputmode="numeric" placeholder="HH:MM"')}</td>
    <td>${input(`r${r}_c9`,'weekly time','inputmode="numeric" placeholder="HH:MM"')}</td>
    <td>${input(`r${r}_c10`,'weekly overtime','inputmode="decimal"')}</td>
    </tr>`;
  }
  return out;
}

function build(){
  // PAGE 1: Exact replica of physical Page 1
  let h=`<div id="first" class="slot">
  <section class="paper"><table>${colgroup}
  <tr><td colspan="11" class="title">NURTURE PEST CONTROL TIME SHEET</td></tr>
  <tr>
    <td colspan="3" rowspan="3" class="headbox">
      Name${input('f_name','persist','value="Martin Law"')}
    </td>
    <td colspan="2" class="b" style="text-align:left;padding-left:3px">VEHICLE REG:</td>
    <td colspan="6">${input('f_reg','persist left b')}</td>
  </tr>
  <tr>
    <th></th><th>Date</th>
    <th colspan="2">Start Mileage</th>
    <th colspan="2">Finish Mileage</th>
    <th>Work Miles</th>
    <th>Private Miles</th>
  </tr>`;

  for(let d=0;d<7;d++){
    h+='<tr>';
    if(d===1){
      h+=`<td colspan="3" rowspan="3" class="headbox">
        Week commencing
        ${input('f_wc','weekly date','placeholder="DD/MM/YY" inputmode="numeric"')}
      </td>`;
    }
    if(d===4){
      h+=`<td colspan="3" rowspan="3" class="headbox">
        Team Leader
        ${input('f_tl','persist')}
      </td>`;
    }
    h+=`<th style="text-align:left;padding-left:3px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d]}</th>
    <td>${input(`m_date_${d}`,'weekly date','inputmode="numeric" placeholder="DD/MM"')}</td>
    <td colspan="2">${input(`m_start_${d}`,'weekly mileage','inputmode="decimal"')}</td>
    <td colspan="2">${input(`m_fin_${d}`,'weekly mileage','inputmode="decimal"')}</td>
    <td>${input(`m_work_${d}`,'weekly mileage','inputmode="decimal"')}</td>
    <td>${input(`m_priv_${d}`,'weekly mileage','inputmode="decimal"')}</td>
    </tr>`;
  }

  h+=`<tr>
    <td colspan="5"></td>
    <td colspan="2" class="b" style="text-align:left;padding-left:3px">TOTALS</td>
    <td colspan="2">${input('m_tot_fin','b','readonly')}</td>
    <td>${input('m_tot_work','b','readonly')}</td>
    <td>${input('m_tot_priv','b','readonly')}</td>
  </tr>
  <tr>
    <td colspan="3" style="font-size:7.5px;text-align:center;font-weight:bold">
      PLEASE CIRCLE DAYS COVERED FOR ON CALL ALLOWANCE
    </td>
    <td></td>
    <td style="text-align:center"><input type="checkbox" class="day-chk check weekly" id="d_fri"><label for="d_fri" class="day-lbl">FRI</label></td>
    <td></td>
    <td style="text-align:center"><input type="checkbox" class="day-chk check weekly" id="d_sat"><label for="d_sat" class="day-lbl">SAT</label></td>
    <td></td>
    <td style="text-align:center"><input type="checkbox" class="day-chk check weekly" id="d_sun"><label for="d_sun" class="day-lbl">SUN</label></td>
    <td></td>
    <td style="text-align:center"><input type="checkbox" class="day-chk check weekly" id="d_mon"><label for="d_mon" class="day-lbl">MON</label></td>
  </tr>
  ${jobHeader()}
  ${rows(0,firstRows)}
  <tr>
    <td></td><td></td><td></td>
    <td class="r">R</td><td class="r">EFK</td><td class="r">F/U</td><td class="r">C/O</td><td class="r">T</td>
    <td></td><td></td><td class="r">Overtime</td>
  </tr>
  <tr>
    <td></td><td></td>
    <td style="text-align:left;padding-left:3px">TOTALS</td>
    ${fields.map(f=>`<td>${input(`tot_${f}_p1`,'b','readonly')}</td>`).join('')}
    <td></td><td></td>
    <td>${input('tot_ot_p1','b','readonly')}</td>
  </tr>
  </table></section></div>`;

  // PAGE 2: Exact replica of physical Page 2
  h+=`<div id="second" class="slot empty">
  <section class="paper"><table>
  ${colgroup}
  ${jobHeader()}
  ${rows(firstRows,totalRows)}
  <tr>
    <td colspan="2" rowspan="5" class="shade" style="vertical-align:bottom;text-align:right;padding:0 18px 2px 0;font-weight:bold">PRIVATE MILES</td>
    <td class="shade"></td>
    <td class="r">R</td><td class="r">EFK</td><td class="r">F/U</td><td class="r">C/O</td><td class="r">T</td>
    <td colspan="2" rowspan="5" class="shade"></td>
    <td class="r">Overtime</td>
  </tr>
  <tr>
    <td style="text-align:left;padding-left:3px">Page 2</td>
    ${fields.map(f=>`<td>${input(`tot_${f}_p2`,'b','readonly')}</td>`).join('')}
    <td>${input('tot_ot_p2','b','readonly')}</td>
  </tr>
  <tr>
    <td style="text-align:left;padding-left:3px">Page 1</td>

    <td class="shade"></td>
  </tr>

      <div style="display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 3px">

      </div>

    ${fields.map(f=>`<td>${input(`tot_${f}`,'b','readonly')}</td>`).join('')}
    <td>${input('tot_ot','b','readonly')}</td>

function asDate(raw,y){
  let m=raw.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(!m)return null;
  let year=m[3]?+m[3]:y;
  if(year<100)year+=2000;
  let d=new Date(year,+m[2]-1,+m[1],12);
  return d.getFullYear()===year&&d.getMonth()===+m[2]-1&&d.getDate()===+m[1]?d:null;
}

function fillDates(){
  const d=asDate(get('f_wc'),new Date().getFullYear());
  if(!d)return;
  for(let i=0;i<7;i++){
    let x=new Date(d);
    x.setDate(d.getDate()+i);
    $(`m_date_${i}`).value=String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0');
  }
}

function rowDate(r){
  let s='';
  for(let i=r;i>=0;i--){
    if(get(`r${i}_c0`)){s=get(`r${i}_c0`);break;}
  }
  let wc=asDate(get('f_wc'),new Date().getFullYear());
  return asDate(s,wc?.getFullYear()||new Date().getFullYear());
}

function time(s){
  let m=s.match(/^(\d{1,2}):(\d{2})$/);
  return m&&+m[1]<24&&+m[2]<60?+m[1]*60 + +m[2]:null;
}

function formatDate(el){
  let s=el.value.replace(/\D/g,'').slice(0,8);
  el.value=s.length>4?s.slice(0,2)+'/'+s.slice(2,4)+'/'+s.slice(4):s.length>2?s.slice(0,2)+'/'+s.slice(2):s;
}

function formatTime(el){
  let s=el.value.replace(/\D/g,'').slice(0,4);
  el.value=s.length>=3?s.slice(0,2)+':'+s.slice(2):s;
}

/*
  Smart Two-Way & Carry-Over Mileage Engine:
  - Never overwrites the box currently being edited or cleared by the user.
  - If Start & Finish are known and you type Private -> auto-fills Work (Finish - Start - Private).
  - If Start & Finish are known and you type Work -> auto-fills Private (Finish - Start - Work).
  - If you manually enter both Work & Private -> adds them to Start to update Finish, and carries Finish to tomorrow's Start.
*/
function solveMileageDay(d, editedKind){
  const sId=`m_start_${d}`, fId=`m_fin_${d}`, wId=`m_work_${d}`, pId=`m_priv_${d}`;

  // 1. Carry over Start Mileage from previous day's Finish (unless user manually typed or cleared Start)
  if(d>0 && editedKind!=='start'){
    let prevFin=NaN;
    for(let j=d-1;j>=0;j--){
      let pf=number(`m_fin_${j}`);
      if(good(pf)){prevFin=pf;break;}
    }
    if(!isMan(sId) && $(sId)?.dataset.cleared!=='1'){
      setMileCell(sId,prevFin,false);
    }
  }

  let s=number(sId), f=number(fId), w=number(wId), p=number(pId);
  let fMan=isMan(fId), wMan=isMan(wId), pMan=isMan(pId);

  if(!good(s)){
    if(!fMan && editedKind!=='fin') setMileCell(fId,NaN,false);
    return;
  }

  if(editedKind==='fin'){
    if(good(f) && f>=s){
      let dist=round(f-s);
      if(pMan && !wMan){
        setMileCell(wId,Math.max(0,dist-p),false);
      }else if(wMan && !pMan){
        setMileCell(pId,Math.max(0,dist-w),false);
      }else if(!wMan && !pMan){
        setMileCell(wId,dist,false);
        setMileCell(pId,NaN,false);
      }
    }else if(!good(f)){
      if(!wMan) setMileCell(wId,NaN,false);
      if(!pMan) setMileCell(pId,NaN,false);
    }
  }else if(editedKind==='priv'){
    if(good(p)){
      if(fMan && !wMan && good(f) && f>=s){
        setMileCell(wId,Math.max(0,round(f-s-p)),false);
      }else{
        let workVal=good(w)?w:0;
        setMileCell(fId,round(s+workVal+p),false);
      }
    }else{
      // Private was deleted
      if(fMan && !wMan && good(f) && f>=s){
        setMileCell(wId,round(f-s),false);
      }else if(wMan && good(w)){
        setMileCell(fId,round(s+w),false);
      }else if(!fMan){
        setMileCell(fId,NaN,false);
      }
    }
  }else if(editedKind==='work'){
    if(good(w)){
      if(fMan && !pMan && good(f) && f>=s){
        let rem=round(f-s-w);
        setMileCell(pId,rem>0?rem:NaN,false);
      }else{
        let privVal=good(p)?p:0;
        setMileCell(fId,round(s+w+privVal),false);
      }
    }else{
      // Work was deleted
      if(fMan && !pMan && good(f) && f>=s){
        setMileCell(pId,round(f-s),false);
      }else if(pMan && good(p)){
        setMileCell(fId,round(s+p),false);
      }else if(!fMan){
        setMileCell(fId,NaN,false);
      }
    }
  }else{
    // Start changed or cascading forward to subsequent days
    if(wMan && pMan){
      setMileCell(fId,round(s+w+p),false);
    }else if(fMan && good(f) && f>=s){
      let dist=round(f-s);
      if(pMan && !wMan){
        setMileCell(wId,Math.max(0,dist-p),false);
      }else if(wMan && !pMan){
        let rem=round(dist-w);
        setMileCell(pId,rem>0?rem:NaN,false);
      }else if(!wMan && !pMan){
        setMileCell(wId,dist,false);
      }
    }else if(wMan || pMan){
      setMileCell(fId,round(s+(good(w)?w:0)+(good(p)?p:0)),false);
    }else if(!fMan){
      setMileCell(fId,NaN,false);
    }
  }

  // Highlight mismatch only if Start is lower than previous day's Finish
  if(d>0){
    let prev=number(`m_fin_${d-1}`);
    let cur=number(sId);
    $(sId).classList.toggle('mismatch',good(prev)&&good(cur)&&cur<prev);
  }
}

function updateMileageTotals(){
  let w=0,p=0,last=NaN,hw=false,hp=false;
  for(let i=0;i<7;i++){
    let a=number(`m_work_${i}`);
    let b=number(`m_priv_${i}`);
    let f=number(`m_fin_${i}`);
    if(good(a)){w+=a;hw=true;}
    if(good(b)){p+=b;hp=true;}
    if(good(f))last=f;
  }
  set('m_tot_work',hw?w:NaN);
  set('m_tot_priv',hp?p:NaN);
  set('m_tot_priv_footer',hp?p:NaN);
  set('m_tot_fin',last);
}

function recomputeMileageFrom(startDay, editedKind){
  for(let i=startDay;i<7;i++){
    solveMileageDay(i, i===startDay?editedKind:null);
  }
  updateMileageTotals();
}

/* Overtime per Clause 7: 08:30-17:00 core, 30m unpaid commute buffer (before 08:00 / after 17:30 = OT) */
function rowOT(r){
  if(manualOT[r])return;
  let a=time(get(`r${r}_c8`));
  let b=time(get(`r${r}_c9`));
  if(a===null||b===null){
    $(`r${r}_c10`).value='';
    return;
  }
  if(b<a)b+=1440;
  let d=rowDate(r);
  let weekend=d&&(d.getDay()===0||d.getDay()===6);
  let ot=0;
  if(weekend){
    ot=b-a;
    if(ot>360)ot-=30;
  }else{
    if(a<480)ot+=Math.min(480,b)-a;
    if(b>1050)ot+=b-Math.max(1050,a);
  }
  ot=Math.round(Math.max(0,ot)/15)*15;
  set(`r${r}_c10`,ot?ot/60:NaN);
}

function totals(){
  let groups=new Map();
  let current='undated';

  for(let r=0;r<totalRows;r++){
    if(get(`r${r}_c0`)){
      let d=rowDate(r);
      current=d?d.toDateString():'row-'+r;
    }
    let a=time(get(`r${r}_c8`));
    let b=time(get(`r${r}_c9`));
    if(a!==null&&b!==null){
      groups.set(current,(groups.get(current)||0)+((b<a?b+1440:b)-a));
    }
  }

  let mins=0,breakMins=0;
  for(let duration of groups.values()){
    let br=duration>360?30:0;
    mins+=duration-br;
    breakMins+=br;
  }

  let usedP2=false;
  for(let r=firstRows;r<totalRows;r++){
    for(let c=0;c<11;c++){
      if(get(`r${r}_c${c}`)){usedP2=true;break;}
    }
    if(usedP2)break;
  }
  $('second').classList.toggle('empty',!usedP2);

  let ot=0;
  for(let c of [3,4,5,6,7,10]){
    let left=0,right=0,hasL=false,hasR=false;
    for(let r=0;r<totalRows;r++){
      let x=get(`r${r}_c${c}`);
      if(!x)continue;
      let n=c===10?Number(x)||0:1;
      if(r<firstRows){left+=n;hasL=true;}
      else{right+=n;hasR=true;}
    }
    let key=c===10?'ot':fields[c-3];
    set(`tot_${key}_p1`,hasL?left:NaN);
    set(`tot_${key}_p2`,hasR?right:NaN);
    set(`tot_${key}_p1_copy`,usedP2&&hasL?left:NaN);
    set(`tot_${key}`,usedP2&&(hasL||hasR)?left+right:NaN);
    if(c===10)ot=left+right;
  }

  let w=0,p=0,days=0;
  for(let i=0;i<7;i++){
    let a=number(`m_work_${i}`);
    let b=number(`m_priv_${i}`);
    if(good(a)&&a>0){w+=a;days++;}
    if(good(b)&&b>0)p+=b;
  }

  $('cw').textContent=round(w);
  $('cp').textContent=round(p);
  $('co').textContent=Math.round(ot*100)/100;
  $('ch').textContent=Math.floor(mins/60)+'h '+String(mins%60).padStart(2,'0')+'m';
  $('ew').textContent='5-day est: '+(days?Math.round(w/days*5):0)+' mi';
  $('days').textContent=days+' days logged';
  $('breaks').textContent=groups.size+' days · −'+breakMins+'m break';
  $('earnings').textContent='£'+(ot*(Number(get('ot_rate'))||0)*(Number(get('ot_mult'))||1)).toFixed(2)+' est';
}

function customSites(){
  try{
    let x=JSON.parse(sGet(ZKEY,'[]'));
    return Array.isArray(x)?x:[];
  }catch(e){return [];}
}

function allSites(){
  let map=new Map(DEFAULT_SITES.map(x=>[x.toLowerCase(),{name:x,zone:''}]));
  for(let s of customSites()){
    if(s&&s.name)map.set(s.name.toLowerCase(),{name:s.name,zone:s.zone||''});
  }
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function renderSites(){
  let box=$('tags');
  box.innerHTML='';
  for(let s of customSites()){
    let chip=document.createElement('span');
    chip.className='tag';
    chip.textContent=s.name+(s.zone?' (Zone '+s.zone+')':'');
    let b=document.createElement('button');
    b.type='button';
    b.textContent='×';
    b.onclick=()=>{
      sSet(ZKEY,JSON.stringify(customSites().filter(x=>x.name!==s.name)));
      renderSites();
      save();
    };
    chip.appendChild(b);
    box.appendChild(chip);
  }
}

function suggest(inp,r){
  let q=inp.value.trim().toLowerCase();
  let box=$('suggest');
  if(!q){box.style.display='none';return;}
  let matches=allSites().filter(s=>s.name.toLowerCase().includes(q)).slice(0,10);
  if(!matches.length){box.style.display='none';return;}
  let rect=inp.getBoundingClientRect();
  box.style.left=(rect.left+window.scrollX)+'px';
  box.style.top=(rect.bottom+window.scrollY)+'px';
  box.style.width=Math.max(220,rect.width)+'px';
  box.innerHTML='';
  for(let s of matches){
    let d=document.createElement('div');
    d.textContent=s.name+(s.zone?' — Z'+s.zone:'');
    d.onpointerdown=e=>{
      e.preventDefault();
      inp.value=s.name;
      if(!get(`r${r}_c2`))$(`r${r}_c2`).value=s.zone;
      box.style.display='none';
      totals();
      save();
    };
    box.appendChild(d);
  }
  box.style.display='block';
}

function snapshot(){
  let inputs={},checks={},manualCells=[],clearedCells=[];
  document.querySelectorAll('input.cell:not([readonly]),input.tick,#ot_rate,#ot_mult').forEach(e=>{
    if(e.id&&e.value!=='')inputs[e.id]=e.value;
    if(e.dataset.manual==='1')manualCells.push(e.id);
    if(e.dataset.cleared==='1')clearedCells.push(e.id);
  });
  document.querySelectorAll('.check').forEach(e=>checks[e.id]=e.checked);
  return {
    inputs,checks,
    meta:{
      manualCells,
      clearedCells,
      manualOvertime:[...manualOT]
    }
  };
}

function save(){
  if(loading)return;
  try{
    sSet(SKEY,JSON.stringify(snapshot()));
  }catch(e){}
}

function load(){
  loading=true;
  try{
    let s=JSON.parse(sGet(SKEY,'null')||'null');
    if(s?.inputs){
      document.querySelectorAll('input.cell:not([readonly]),input.tick,#ot_rate,#ot_mult').forEach(e=>{
        e.value=e.id==='f_name'?'Martin Law':e.id==='ot_rate'?'15.66':e.id==='ot_mult'?'1.5':'';
        e.dataset.manual='0';
        e.dataset.cleared='0';
      });
      document.querySelectorAll('.check').forEach(e=>e.checked=false);
      for(let [id,v] of Object.entries(s.inputs)){
        let e=$(id);
        if(e&&(e.classList.contains('tick')||!e.readOnly)&&['string','number'].includes(typeof v)){
          e.value=String(v);
        }
      }
      for(let [id,v] of Object.entries(s.checks||{})){
        if($(id))$(id).checked=!!v;
      }
      if(Array.isArray(s.meta?.manualCells)){
        s.meta.manualCells.forEach(id=>{if($(id))$(id).dataset.manual='1';});
      }else{
        // Backwards-compatible migration for existing saved data
        for(let i=0;i<7;i++){
          ['start','fin','work','priv'].forEach(k=>{
            let id=`m_${k}_${i}`;
            if(get(id)!=='')$(id).dataset.manual='1';
          });
        }
      }
      if(Array.isArray(s.meta?.clearedCells)){
        s.meta.clearedCells.forEach(id=>{if($(id))$(id).dataset.cleared='1';});
      }
      manualOT=Array.from({length:totalRows},(_,i)=>!!s.meta?.manualOvertime?.[i]);
    }else if(sGet(CKEY)!==''){
      setMileCell('m_start_0',Number(sGet(CKEY)),false);
    }
    updateMileageTotals();
    totals();
  }catch(e){}
  finally{loading=false;}
}

function backup(){
  save();
  let data={
    timestamp:Date.now(),
    storage:sGet(SKEY),
    sites:sGet(ZKEY),
    pin:sGet(PKEY),
    carry:sGet(CKEY)
  };
  let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  let a=document.createElement('a');
  a.href=u;
  a.download='work_hub_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

function importBackup(f){
  if(!f)return;
  let rd=new FileReader();
  rd.onload=()=>{
    try{
      let x=JSON.parse(rd.result);
      if(!JSON.parse(x.storage)?.inputs)throw Error('Invalid');
      sSet(SKEY,x.storage);
      if(typeof x.sites==='string')sSet(ZKEY,x.sites);
      if(typeof x.carry==='string')sSet(CKEY,x.carry);
      if(/^\d{4}$/.test(x.pin||''))sSet(PKEY,x.pin);
      load();
      renderSites();
      save();
      alert('Backup imported');
    }catch(e){
      alert('Invalid backup file');
    }finally{$('file').value='';}
  };
  rd.readAsText(f);
}

function newWeek(){
  if(!confirm('Start a new week? Your name, vehicle, leader and saved sites stay.'))return;
  let last=NaN;
  for(let i=6;i>=0;i--){
    if(good(number(`m_fin_${i}`))){last=number(`m_fin_${i}`);break;}
  }
  if(good(last))sSet(CKEY,String(last));
  document.querySelectorAll('.weekly').forEach(e=>{
    if(e.type==='checkbox')e.checked=false;
    else{
      e.value='';
      e.dataset.manual='0';
      e.dataset.cleared='0';
      e.classList.remove('mismatch');
    }
  });
  manualOT.fill(false);
  if(good(last))setMileCell('m_start_0',last,false);
  updateMileageTotals();
  totals();
  save();
}

function onInput(e){
  let el=e.target,id=el.id;
  if(!id||['pininput','site_name','site_zone'].includes(id))return;

  if(el.classList.contains('date')){
    formatDate(el);
    if(id==='f_wc')fillDates();
  }
  if(el.classList.contains('time')){
    formatTime(el);
  }

  let m=id.match(/^m_(start|fin|work|priv)_(\d)$/);
  if(m){
    let kind=m[1], d=+m[2];
    let hasText=get(id)!=='';
    el.dataset.manual=hasText?'1':'0';
    el.dataset.cleared=hasText?'0':'1';
    recomputeMileageFrom(d, kind);
  }

  let r=id.match(/^r(\d+)_c(\d+)$/);
  if(r){
    let i=+r[1],c=+r[2];
    if(c===1){
      let match=allSites().find(s=>s.name.toLowerCase()===get(id).toLowerCase());
      if(match&&match.zone&&!get(`r${i}_c2`))$(`r${i}_c2`).value=match.zone;
      suggest(el,i);
    }
    if(c===8||c===9)rowOT(i);
    if(c===10)manualOT[i]=!!get(id);
  }

  totals();
  save();
}

function init(){
  build();
  load();
  renderSites();

  $('unlock').onclick=verify;
  $('pininput').oninput=()=>{if(get('pininput').length===4)verify();};
  $('opentool').onclick=()=>view('app');
  $('back').onclick=()=>view('hub');
  $('lock').onclick=()=>{sDel(AKEY);view('pin');};

  $('changepin').onclick=()=>{
    let old=prompt('Current PIN:');
    if(old===null)return;
    if(old!==(sGet(PKEY,'1234')||'1234')){return alert('Incorrect PIN');}
    let pin=prompt('New four-digit PIN:');
    if(/^\d{4}$/.test(pin||'')){sSet(PKEY,pin);alert('PIN changed');}
    else if(pin!==null){alert('Enter four digits');}
  };

  $('pdf').onclick=()=>window.print();
  $('newweek').onclick=newWeek;
  $('managesites').onclick=()=>{$('sites').style.display=$('sites').style.display==='block'?'none':'block';};

  $('addsite').onclick=()=>{
    let n=get('site_name'),z=get('site_zone');
    if(!n)return;
    let arr=customSites().filter(x=>x.name.toLowerCase()!==n.toLowerCase());
    arr.push({name:n,zone:z});
    sSet(ZKEY,JSON.stringify(arr));
    $('site_name').value='';
    $('site_zone').value='';
    renderSites();
    save();
  };

  $('export').onclick=backup;
  $('import').onclick=()=>$('file').click();
  $('file').onchange=e=>importBackup(e.target.files[0]);

  document.addEventListener('input',onInput);
  document.addEventListener('change',e=>{
    if(e.target.classList.contains('check')||e.target.id==='ot_mult'){totals();save();}
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('#suggest')&&!e.target.classList.contains('site'))$('suggest').style.display='none';
  });
  document.querySelectorAll('.tick').forEach(e=>{
    e.onclick=()=>{e.value=e.value==='✓'?'':'✓';totals();save();};
  });

  window.addEventListener('resize',fit);
  window.addEventListener('afterprint',fit);

  view(sGet(AKEY)==='1'?'hub':'pin');
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
